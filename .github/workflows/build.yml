name: Build Lua 5.5 WASM Compiler
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    name: Build Lua 5.5.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
      - name: Verify Emscripten
        run: |
          emcc --version
          emcc --check
      - name: Download Lua 5.5.1
        run: |
          curl -L --fail \
            https://www.lua.org/ftp/lua-5.5.1.tar.gz \
            -o lua-5.5.1.tar.gz
          tar -xzf lua-5.5.1.tar.gz
      - name: Build luac with Emscripten
        run: |
          mkdir -p site
          SRC="lua-5.5.1/src"
          emcc \
            "$SRC/luac.c" \
            "$SRC/lapi.c" \
            "$SRC/lcode.c" \
            "$SRC/lctype.c" \
            "$SRC/ldebug.c" \
            "$SRC/ldo.c" \
            "$SRC/ldump.c" \
            "$SRC/lfunc.c" \
            "$SRC/lgc.c" \
            "$SRC/llex.c" \
            "$SRC/lmem.c" \
            "$SRC/lobject.c" \
            "$SRC/lopcodes.c" \
            "$SRC/lparser.c" \
            "$SRC/lstate.c" \
            "$SRC/lstring.c" \
            "$SRC/ltable.c" \
            "$SRC/ltm.c" \
            "$SRC/lundump.c" \
            "$SRC/lvm.c" \
            "$SRC/lzio.c" \
            -I"$SRC" \
            -O3 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sFORCE_FILESYSTEM=1 \
            -sEXPORTED_RUNTIME_METHODS='["FS","callMain"]' \
            -sEXIT_RUNTIME=0 \
            -sALLOW_MEMORY_GROWTH=1 \
            -o site/luac.js
      - name: Copy website
        run: |
          cp index.html site/index.html
      - name: Show generated files
        run: |
          echo "Generated site:"
          ls -lh site/
          echo
          file site/luac.js
          file site/luac.wasm
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
